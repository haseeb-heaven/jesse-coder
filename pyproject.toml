[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jesse-coder"
version = "1.0.0"
description = "General-purpose real-time coding agent with isolated subprocess execution, multi-model support, and live streaming."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Haseeb Mir", email = "haseeb@example.com"}
]
keywords = ["ai", "agent", "coding", "llm", "jesse", "cli", "tui", "streaming", "subprocess"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "openai>=1.12.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "textual>=0.47.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "pyperclip>=1.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jesse-coder = "interfaces.cli.main:main"
jesse-cli = "interfaces.cli.main:main"
jesse-tui = "interfaces.tui.main:main"
jesse-gui = "interfaces.gui.app:main"
jesse-web = "interfaces.gui.app:main"
jesse-test = "testing.automated_testing:run_automated_testing"

[tool.setuptools.packages.find]
where = ["source", "interfaces"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
